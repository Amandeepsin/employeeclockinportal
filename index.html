<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <meta http-equiv="Permissions-Policy" content="camera=(self)">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sora', sans-serif;
            background: #080c14;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated grid background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(99,179,237,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,179,237,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56,189,248,0.06) 0%, transparent 70%);
            top: -100px; left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Kiosk header clock */
        .live-clock {
            font-family: 'DM Mono', monospace;
            font-size: 3rem;
            font-weight: 500;
            color: #f0f9ff;
            letter-spacing: -1px;
            line-height: 1;
        }
        .live-date {
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Employee active tile */
        .emp-tile {
            background: linear-gradient(135deg, rgba(15,23,42,0.9) 0%, rgba(15,23,42,0.7) 100%);
            border: 1px solid rgba(56,189,248,0.2);
            border-radius: 16px;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: tileIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        .emp-tile::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            opacity: 0.7;
        }
        .emp-tile:hover {
            border-color: rgba(56,189,248,0.4);
            transform: translateY(-2px);
        }

        @keyframes tileIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Elapsed time */
        .elapsed {
            font-family: 'DM Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

        /* Pulse dot */
        .pulse-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4ade80;
            position: relative;
            flex-shrink: 0;
        }
        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: rgba(74,222,128,0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%       { transform: scale(1.8); opacity: 0; }
        }

        /* Login panel */
        .login-panel {
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(56,189,248,0.15);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            padding: 36px;
            width: 100%;
            max-width: 380px;
            animation: panelIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;

        @keyframes panelIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }

        .inp {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(100,116,139,0.3);
            border-radius: 10px;
            padding: 12px 16px;

            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;

            transition: border-color 0.2s;

        .inp:focus { border-color: #38bdf8; }
        .inp::placeholder { color: #475569; }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-family: 'Sora', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;

        .btn-primary:hover { background: linear-gradient(135deg, #38bdf8, #0ea5e9); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-clock-out {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            border-radius: 8px;
            padding: 7px 14px;
            font-family: 'Sora', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;

            transition: all 0.2s;

        }
        .btn-clock-out:hover {
            background: rgba(239,68,68,0.2);
            border-color: rgba(239,68,68,0.5);
        }

        /* Avatar */
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: 1rem;

            flex-shrink: 0;

        /* Empty state */
        .empty-state {
            border: 1px dashed rgba(56,189,248,0.15);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            color: #334155;
        }

        /* Success flash */
        .flash {
            animation: flashIn 0.3s ease both, flashOut 0.4s ease 1.8s both;
        }
        @keyframes flashIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes flashOut {
            from { opacity: 1; }
            to   { opacity: 0; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }

        /* Password toggle */
        .pw-wrap { position: relative; }
        .pw-toggle {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: #475569; cursor: pointer;
            padding: 2px;
            display: flex; align-items: center;

        .pw-toggle:hover { color: #94a3b8; }

        /* Header badge */
        .badge-active {
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.25);
            color: #4ade80;
            border-radius: 20px;

        .overlay {

            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;

        .confirm-card {
            background: #0f172a;
            border: 1px solid rgba(56,189,248,0.2);
            border-radius: 20px;
            padding: 32px;

            animation: panelIn 0.25s ease both;

        @media (max-width: 640px) {
            .live-clock { font-size: 2rem; }

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Firebase setup (same project as WorkFlow)
const firebaseConfig = {

// ════════════════════════════════════════════════════════════════
// EMAIL ALERTS CONFIG — EmailJS
// ════════════════════════════════════════════════════════════════
// Single template handles both owner and employee recipients.
// The kiosk passes a pre-formatted {{subject_line}} and {{message_body}}
// so the template stays simple and bypasses EmailJS's 2-template limit
// on the free plan.
const EMAILJS_PUBLIC_KEY = 'kCr-3kOwysUk3qmb_';
const EMAILJS_SERVICE_ID = 'service_sfiwb1c';
const EMAILJS_ALERT_TEMPLATE_ID = 'template_skn1j5b';  // WorkFlow Owner Alert template

// ── sendAlertEmail — sends an alert via EmailJS
// recipient: 'owner' or 'employee' (decides wording of subject + body)
async function sendAlertEmail({ recipient, to, toName, employeeName, alertType, shiftTime, date }) {
    if (!to) return { ok: false, error: 'no recipient' };

    // Build subject + body based on who's receiving it
    let subjectLine, messageBody;
    if (recipient === 'employee') {
        subjectLine = `Reminder: ${alertType}`;
        messageBody =
            `This is a reminder that you have a ${alertType} today.\n\n` +
            `Date: ${date}\n` +
            `Scheduled shift time: ${shiftTime}\n\n` +
            `If this is a mistake, please clock in/out as soon as possible or contact your manager.`;
    } else {
        subjectLine = `WorkFlow Alert: ${employeeName} — ${alertType}`;
        messageBody =
            `${employeeName} has a ${alertType} alert.\n\n` +
            `Date: ${date}\n` +
            `Scheduled shift time: ${shiftTime}\n\n` +
            `Please follow up as needed.`;
    }

    try {
        // Lazy-load EmailJS SDK
        if (typeof emailjs === 'undefined') {
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Failed to load EmailJS'));
                document.head.appendChild(script);
            });
        }
        if (!emailjs._userID) {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        }
        const params = {
            to_email: to,
            to_name: toName || 'there',
            subject_line: subjectLine,
            message_body: messageBody
        };
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_ALERT_TEMPLATE_ID, params);
        return { ok: true };
    } catch (err) {
        console.error('[EmailAlerts] Send error:', err);
        return { ok: false, error: err.message || 'email failed' };
    }
}

// ── IP Restriction helper (same as main WorkFlow portal)
const IPRestriction = {
    enabled: true,

    checkEmployeeIP: async (employee) => {
        if (!IPRestriction.enabled) {
            return { allowed: true, ip: 'IP checking disabled' };
        }

        // If employee has no IPs configured, allow access (backward compatibility)
        if (!employee.allowedIPs || employee.allowedIPs.length === 0) {
            return { allowed: true, ip: 'No IP restriction set' };
        }

        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            const userIP = data.ip;
            const allowed = employee.allowedIPs.includes(userIP);
            return { allowed, ip: userIP, allowedIPs: employee.allowedIPs };
        } catch (error) {
            console.error('Error checking IP:', error);
            // Deny on failure — silently allowing would bypass geo-locking
            return { allowed: false, ip: 'IP verification failed — check your connection or contact your manager.' };
        }
    }
};

// ── Helpers
const pad = n => String(n).padStart(2, '0');

const formatElapsed = (clockInISO) => {
    const diff = Math.floor((Date.now() - new Date(clockInISO)) / 1000);
    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;
    return h > 0
        ? `${h}:${pad(m)}:${pad(s)}`
        : `${pad(m)}:${pad(s)}`;
};

const formatTime12 = (iso) => {
    if (!iso) return '--';
    const d = new Date(iso);
    let h = d.getHours(), mn = d.getMinutes();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${pad(mn)} ${ap}`;
};

const initials = (name) => name.trim().split(' ').map(w => w[0]?.toUpperCase()).join('').slice(0,2);

// Convert "HH:MM" 24-hour string to 12-hour display (e.g. "20:00" → "8:00 PM")
const format12h = (timeStr) => {
    if (!timeStr || !timeStr.includes(':')) return timeStr || '';
    const [h, m] = timeStr.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    return `${h % 12 || 12}:${pad(m)} ${ampm}`;
};

// ── EyeIcon inline
const EyeIcon = ({ open }) => open ? (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
) : (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
);

// ════════════════════════════════════════════════════════════════
// CAMERA FRAME GRABBER
// ════════════════════════════════════════════════════════════════
// Given a <video> element that is already streaming, captures one
// frame as a 320x240 JPEG (base64). Returns null on failure.
// The mirrored draw matches how the user sees themselves in the oval.
function grabFrame(videoEl) {
    try {
        if (!videoEl || videoEl.readyState < 2) return null;
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 240;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.7);
    } catch (err) {
        console.error('grabFrame failed:', err);
        return null;
    }
}

// ── Main App
const App = () => {
    const [employees, setEmployees]   = useState([]);
    const [tick, setTick]             = useState(0);
    const [loginForm, setLoginForm]   = useState({ username: '', password: '' });
    const [showPw, setShowPw]         = useState(false);
    const [loginError, setLoginError] = useState('');
    const [loginLoading, setLoginLoading] = useState(false);
    const [flash, setFlash]           = useState(null); // { name, action: 'in'|'out' }
    const [confirmClockOut, setConfirmClockOut] = useState(null); // employee obj
    const [clockOutPassword, setClockOutPassword] = useState('');
    const [clockOutError, setClockOutError]       = useState('');
    const [clockOutLoading, setClockOutLoading]   = useState(false);
    const [showClockOutPw, setShowClockOutPw]     = useState(false);
    const [nowStr, setNowStr]         = useState('');
    const [dateStr, setDateStr]       = useState('');
    const [kioskIP, setKioskIP]       = useState(null);     // this iPad's public IP
    const [kioskIPError, setKioskIPError] = useState(null); // null until detection completes
    const [owner, setOwner]           = useState(null);     // for owner phone + alert channel

    // ── Online/offline detection.
    // navigator.onLine + the online/offline events catch the obvious cases
    // (wifi dropped). It's not perfect — onLine can be true while the connection
    // is dead — so clock-in/out also do a live Firebase check before writing.
    const [isOnline, setIsOnline] = useState(navigator.onLine);
    useEffect(() => {
        const goOnline = () => setIsOnline(true);
        const goOffline = () => setIsOnline(false);
        window.addEventListener('online', goOnline);
        window.addEventListener('offline', goOffline);
        return () => {
            window.removeEventListener('online', goOnline);
            window.removeEventListener('offline', goOffline);
        };
    }, []);

    // ── Camera stream (continuous, live oval preview above clock-in form)
    const videoRef = useRef(null);
    const streamRef = useRef(null);
    const [cameraError, setCameraError] = useState(null); // null if working, string if denied/unavailable

    useEffect(() => {
        let cancelled = false;
        async function startStream() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                if (cancelled) {
                    stream.getTracks().forEach(t => t.stop());
                    return;
                }
                streamRef.current = stream;
                if (videoRef.current) {
                    videoRef.current.srcObject = stream;
                }
                setCameraError(null);
            } catch (err) {
                console.warn('Camera unavailable:', err);
                setCameraError(err.name === 'NotAllowedError' ? 'Camera permission denied' : (err.message || 'Camera unavailable'));
            }
        }
        startStream();
        return () => {
            cancelled = true;
            if (streamRef.current) {
                streamRef.current.getTracks().forEach(t => t.stop());
                streamRef.current = null;
            }
        };
    }, []);

    // Listen to owner doc for alert recipient phone + channel preference
    useEffect(() => {
        const unsub = db.collection('owner').doc('ownerData').onSnapshot(doc => {
            if (doc.exists) setOwner(doc.data());
        });
        return () => unsub();
    }, []);

    // Detect this kiosk's public IP once on mount — used to filter which employees show on this screen
    useEffect(() => {
        const fetchIP = async () => {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                setKioskIP(data.ip);
                setKioskIPError(null);
            } catch (err) {
                console.error('Failed to detect kiosk IP:', err);
                setKioskIPError('Could not detect this location. Check internet connection.');
            }
        };
        fetchIP();
        // Re-check every 10 minutes in case the network changes
        const interval = setInterval(fetchIP, 10 * 60 * 1000);
        return () => clearInterval(interval);
    }, []);

    // 1-second tick for elapsed timers + live clock
    useEffect(() => {
        const interval = setInterval(() => {
            setTick(t => t + 1);
            const now = new Date();
            const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            const ap = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            setNowStr(`${h12}:${pad(m)}:${pad(s)} ${ap}`);
            setDateStr(now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }));
        }, 1000);
        return () => clearInterval(interval);
    }, []);

    // Live listener on employees collection
    useEffect(() => {
        const unsub = db.collection('employees').onSnapshot(snap => {
            const list = [];
            snap.forEach(doc => list.push({ ...doc.data(), id: doc.id }));
            // Sort by order field
            list.sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
            setEmployees(list);
        });
        return () => unsub();
    }, []);

    // Show only employees whose allowed IPs include this kiosk's IP.
    // If kiosk IP isn't known yet, show nothing (waiting on detection).
    // Employees with no allowedIPs configured don't appear on any kiosk by location —
    // they need an IP set for the kiosk to know where they belong.
    const clockedInEmployees = employees.filter(e => {
        if (!e.clockedIn || !e.clockInTime) return false;
        if (!kioskIP) return false;
        if (!Array.isArray(e.allowedIPs) || e.allowedIPs.length === 0) return false;
        return e.allowedIPs.includes(kioskIP);
    });

    // ════════════════════════════════════════════════════════════════
    // LATE / MISSED CLOCK ALERTS
    // ════════════════════════════════════════════════════════════════
    // Runs every 60 seconds. Checks EVERY employee in the system (not just
    // local ones) for:
    //   - 5 min past their scheduled opening time with no clock-in → "missed clock-in" alert
    //   - 5 min past their scheduled closing time still clocked-in → "missed clock-out" alert
    //
    // Alerts are NOT location-bound — they're based on Firebase data, not which
    // kiosk is checking. Firebase dedup ensures exactly one alert fires per
    // employee per event per day even when multiple iPads run the check.
    //
    // NOTE: Requires at least one iPad to be awake with this page open.
    // Set iPadOS auto-lock to "Never" and keep it plugged in.
    useEffect(() => {
        const GRACE_MINUTES = 5;

        const parseToday = (timeStr) => {
            if (!timeStr || !timeStr.includes(':')) return null;
            const [h, m] = timeStr.split(':').map(Number);
            const d = new Date();
            d.setHours(h, m, 0, 0);
            return d;
        };

        const todayKey = () => {
            const d = new Date();
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        };

        const claimAlert = async (empId, type, today) => {
            const docId = `${empId}_${today}_${type}`;
            const ref = db.collection('alertsLog').doc(docId);
            try {
                const claimed = await db.runTransaction(async (tx) => {
                    const snap = await tx.get(ref);
                    if (snap.exists) return false;
                    tx.set(ref, {
                        empId,
                        type,
                        date: today,
                        firedAt: new Date().toISOString(),
                        firedBy: kioskIP || 'unknown'
                    });
                    return true;
                });
                return claimed;
            } catch (err) {
                console.error('[Alerts] Claim transaction failed:', err);
                return false;
            }
        };

        const check = async () => {
            const now = new Date();
            const today = todayKey();
            for (const emp of employees) {
                if (!emp.alertsEnabled) continue;
                const open  = parseToday(emp.schedule?.openingTime);
                const close = parseToday(emp.schedule?.closingTime);
                const dateLabel = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });

                if (open && !emp.clockedIn) {
                    const minsLate = (now - open) / 60000;
                    if (minsLate >= GRACE_MINUTES && minsLate < 480) {
                        const claimed = await claimAlert(emp.id, 'lateIn', today);
                        if (claimed) {
                            // Email to owner
                            if (owner?.email) {
                                sendAlertEmail({
                                    recipient: 'owner',
                                    to: owner.email,
                                    toName: 'Owner',
                                    employeeName: emp.name,
                                    alertType: 'Missed Clock-In',
                                    shiftTime: emp.schedule.openingTime,
                                    date: dateLabel
                                });
                            }
                            // Email to employee
                            if (emp.email) {
                                sendAlertEmail({
                                    recipient: 'employee',
                                    to: emp.email,
                                    toName: emp.name.split(' ')[0],
                                    employeeName: emp.name,
                                    alertType: 'Missed Clock-In',
                                    shiftTime: emp.schedule.openingTime,
                                    date: dateLabel
                                });
                            }
                        }
                    }
                }
                if (close && emp.clockedIn) {
                    const minsOver = (now - close) / 60000;
                    if (minsOver >= GRACE_MINUTES && minsOver < 480) {
                        const claimed = await claimAlert(emp.id, 'lateOut', today);
                        if (claimed) {
                            // Email to owner
                            if (owner?.email) {
                                sendAlertEmail({
                                    recipient: 'owner',
                                    to: owner.email,
                                    toName: 'Owner',
                                    employeeName: emp.name,
                                    alertType: 'Missed Clock-Out',
                                    shiftTime: emp.schedule.closingTime,
                                    date: dateLabel
                                });
                            }
                            // Email to employee
                            if (emp.email) {
                                sendAlertEmail({
                                    recipient: 'employee',
                                    to: emp.email,
                                    toName: emp.name.split(' ')[0],
                                    employeeName: emp.name,
                                    alertType: 'Missed Clock-Out',
                                    shiftTime: emp.schedule.closingTime,
                                    date: dateLabel
                                });
                            }
                        }
                    }
                }
            }
        };

        check();
        const interval = setInterval(check, 60 * 1000);
        return () => clearInterval(interval);
    }, [employees, owner, kioskIP]);

    const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginLoading(true);

        // ── Offline guard: no internet = can't verify or record anything.
        if (!navigator.onLine) {
            setLoginError('No internet connection. Clock-in is unavailable — please notify the owner so your shift can be added manually.');
            setLoginLoading(false);
            return;
        }

        const emp = employees.find(
            e => e.username === loginForm.username.trim() && e.password === loginForm.password
        );

        if (!emp) {
            setLoginError('Username or password is incorrect.');
            setLoginLoading(false);
            return;
        }

        if (emp.clockedIn) {
            setLoginError(`${emp.name} is already clocked in.`);
            setLoginLoading(false);
            return;
        }

        // Check IP address for this specific employee
        const ipCheck = await IPRestriction.checkEmployeeIP(emp);
        if (!ipCheck.allowed) {
            setLoginError(`Access denied. You can only clock in from your assigned location(s). Your current IP: ${ipCheck.ip}`);
            setLoginLoading(false);
            return;
        }

        try {
            const now = new Date().toISOString();

            // ── Snap clock-in photo from live oval preview
            const photo = grabFrame(videoRef.current);
            const photoMissingIn = !photo;

            // Race the Firebase write against a 12s timeout. navigator.onLine can
            // report true while the connection is actually dead — without this,
            // the write would hang and the employee would stare at a spinner.
            const writePromise = db.collection('employees').doc(emp.id.toString()).update({
                clockedIn: true,
                clockInTime: now,
                clockOutTime: null,
                clockInPhoto: photo,
                photoMissingIn: photoMissingIn,
                isLateToday: false,
                minutesLate: 0
            });
            await Promise.race([
                writePromise,
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 12000))
            ]);

            // ── If photo failed, email owner
            if (photoMissingIn && owner?.email) {
                const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
                sendAlertEmail({
                    recipient: 'owner',
                    to: owner.email,
                    toName: 'Owner',
                    employeeName: emp.name,
                    alertType: 'Camera Failure (Clock-In)',
                    shiftTime: emp.schedule?.openingTime || 'N/A',
                    date: today
                });
            }

            setFlash({ name: emp.name, action: 'in' });
            setTimeout(() => setFlash(null), 2200);
        } catch(err) {
            if (err.message === 'timeout') {
                setLoginError('Connection problem — clock-in could not be saved. Please notify the owner so your shift can be added manually.');
            } else {
                setLoginError('Failed to clock in. Try again.');
            }
        }

        setLoginForm({ username: '', password: '' });
        setShowPw(false);
        setLoginLoading(false);
    };

    const handleClockOut = async (emp, password) => {
        // Verify the password matches the employee
        if (!password || password !== emp.password) {
            setClockOutError('Incorrect password.');
            return;
        }

        // ── Offline guard
        if (!navigator.onLine) {
            setClockOutError('No internet connection. Clock-out is unavailable — please notify the owner so your shift can be corrected manually.');
            return;
        }

        setClockOutLoading(true);
        setClockOutError('');

        // Verify IP matches employee's allowed locations
        const ipCheck = await IPRestriction.checkEmployeeIP(emp);
        if (!ipCheck.allowed) {
            setClockOutLoading(false);
            setConfirmClockOut(null);
            setClockOutPassword('');
            setClockOutError('');
            setShowClockOutPw(false);
            setFlash({
                name: emp.name,
                action: 'denied',
                message: `Cannot clock out — not at an authorized location. IP: ${ipCheck.ip}`
            });
            setTimeout(() => setFlash(null), 3500);
            return;
        }

        try {
            const now = new Date().toISOString();
            const clockInISO = emp.clockInTime;
            const grossMin = Math.max(0, (new Date(now) - new Date(clockInISO)) / 60000);
            const paidHours = parseFloat((grossMin / 60).toFixed(2));
            const rate = emp.hourlyRate || 0;
            const pay  = parseFloat((paidHours * rate).toFixed(2));

            // ── Snap clock-out photo from live oval preview
            const photo = grabFrame(videoRef.current);
            const clockOutPhoto = photo;
            const photoMissingOut = !photo;

            const entry = {
                id: Date.now() + Math.random(),
                date: now,
                clockIn: clockInISO,
                clockOut: now,
                clockInPhoto: emp.clockInPhoto || null,
                photoMissingIn: !!emp.photoMissingIn,
                clockOutPhoto: clockOutPhoto,
                photoMissingOut: photoMissingOut,
                grossMinutes: Math.round(grossMin),
                paidMinutes: Math.round(grossMin),
                paidHours,
                hourlyRate: rate,
                pay,
                wasLate: emp.isLateToday || false,
                minutesLate: emp.minutesLate || 0
            };

            const existingHistory = emp.workHistory || [];
            const writePromise = db.collection('employees').doc(emp.id.toString()).update({
                clockedIn: false,
                clockOutTime: now,
                workHistory: [...existingHistory, entry],
                // Clear ephemeral photo from employee doc now that it's saved in workHistory
                clockInPhoto: null,
                photoMissingIn: false,
                isLateToday: false,
                minutesLate: 0
            });
            await Promise.race([
                writePromise,
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 12000))
            ]);

            // ── If photo failed, email owner
            if (photoMissingOut && owner?.email) {
                const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
                sendAlertEmail({
                    recipient: 'owner',
                    to: owner.email,
                    toName: 'Owner',
                    employeeName: emp.name,
                    alertType: 'Camera Failure (Clock-Out)',
                    shiftTime: emp.schedule?.closingTime || 'N/A',
                    date: today
                });
            }

            setFlash({ name: emp.name, action: 'out' });
            setTimeout(() => setFlash(null), 2200);
        } catch(err) {
            console.error('Clock out error:', err);
            if (err.message === 'timeout') {
                setClockOutError('Connection problem — clock-out could not be saved. Please notify the owner.');
            } else {
                setClockOutError('Failed to clock out. Try again.');
            }
            setClockOutLoading(false);
            return;
        }

        // Success — reset everything and close overlay
        setConfirmClockOut(null);
        setClockOutPassword('');
        setClockOutError('');
        setShowClockOutPw(false);
        setClockOutLoading(false);
    };

    return (
        <div style={{ position: 'relative', minHeight: '100vh' }}>
            <div className="bg-grid" />
            <div className="bg-glow" />

            {/* Offline banner — sticks to top, always visible while offline */}
            {!isOnline && (
                <div style={{
                    position: 'fixed', top: 0, left: 0, right: 0,
                    zIndex: 300,
                    background: 'rgba(127,29,29,0.97)',
                    borderBottom: '1px solid rgba(248,113,113,0.5)',
                    color: '#fecaca',
                    padding: '12px 20px',
                    textAlign: 'center',
                    fontSize: '0.9rem',
                    fontWeight: 600,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8
                }}>
                    <span style={{ fontSize: '1.1rem' }}>⚠️</span>
                    No internet connection — clock-in and clock-out are unavailable. Notify the owner so shifts can be added manually.
                </div>
            )}

            {/* Flash notification */}
            {flash && (
                <div className="flash" style={{
                    position: 'fixed', top: 24, left: '50%', transform: 'translateX(-50%)',
                    zIndex: 200,
                    background: flash.action === 'in' ? 'rgba(20,83,45,0.95)' :
                                flash.action === 'out' ? 'rgba(127,29,29,0.95)' :
                                'rgba(120,53,15,0.95)',
                    border: `1px solid ${
                        flash.action === 'in' ? 'rgba(74,222,128,0.4)' :
                        flash.action === 'out' ? 'rgba(248,113,113,0.4)' :
                        'rgba(251,191,36,0.45)'
                    }`,
                    borderRadius: 12, padding: '12px 24px',
                    color: flash.action === 'in' ? '#4ade80' :
                           flash.action === 'out' ? '#f87171' :
                           '#fbbf24',
                    fontWeight: 600, fontSize: '0.9rem',
                    display: 'flex', alignItems: 'center', gap: 8,
                    maxWidth: '90vw',
                    boxShadow: '0 8px 32px rgba(0,0,0,0.4)'
                }}>
                    <span>
                        {flash.action === 'in' ? '✓' : flash.action === 'out' ? '→' : '⚠'}
                    </span>
                    <span>
                        {flash.action === 'denied'
                            ? flash.message
                            : `${flash.name} clocked ${flash.action === 'in' ? 'IN' : 'OUT'}`}
                    </span>
                </div>
            )}

            {/* Confirm clock-out overlay with password verification */}
            {confirmClockOut && (
                <div className="overlay" onClick={() => {
                    setConfirmClockOut(null);
                    setClockOutPassword('');
                    setClockOutError('');
                    setShowClockOutPw(false);
                }}>
                    <div className="confirm-card" onClick={e => e.stopPropagation()}>
                        <div style={{ fontSize: '2.5rem', marginBottom: 16 }}>👋</div>
                        <h3 style={{ fontSize: '1.2rem', fontWeight: 700, marginBottom: 8, color: '#f1f5f9' }}>
                            Clock out {confirmClockOut.name}?
                        </h3>
                        <p style={{ color: '#64748b', fontSize: '0.85rem', marginBottom: 20 }}>
                            Clocked in at {formatTime12(confirmClockOut.clockInTime)} · {formatElapsed(confirmClockOut.clockInTime)} elapsed
                        </p>

                        {/* Password verification */}
                        <form onSubmit={(e) => {
                            e.preventDefault();
                            handleClockOut(confirmClockOut, clockOutPassword);
                        }}>
                            <div style={{ marginBottom: 12, textAlign: 'left' }}>
                                <label style={{ display: 'block', fontSize: '0.7rem', color: '#94a3b8', fontWeight: 600, letterSpacing: '1px', textTransform: 'uppercase', marginBottom: 6 }}>
                                    Enter your password
                                </label>
                                <div style={{ position: 'relative' }}>
                                    <input
                                        type={showClockOutPw ? 'text' : 'password'}
                                        value={clockOutPassword}
                                        onChange={(e) => { setClockOutPassword(e.target.value); setClockOutError(''); }}
                                        autoFocus
                                        placeholder="••••••••"
                                        style={{
                                            width: '100%', padding: '11px 40px 11px 14px',
                                            borderRadius: 10, border: clockOutError ? '1px solid rgba(248,113,113,0.5)' : '1px solid rgba(100,116,139,0.3)',
                                            background: 'rgba(15,23,42,0.6)', color: '#f1f5f9',
                                            fontFamily: 'Sora, sans-serif', fontSize: '0.9rem', outline: 'none'
                                        }}
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowClockOutPw(!showClockOutPw)}
                                        style={{
                                            position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)',
                                            background: 'transparent', border: 'none', color: '#64748b',
                                            cursor: 'pointer', padding: 4, fontSize: '0.75rem'
                                        }}
                                    >
                                        {showClockOutPw ? '🙈' : '👁'}
                                    </button>
                                </div>
                                {clockOutError && (
                                    <p style={{ color: '#f87171', fontSize: '0.75rem', marginTop: 6, marginBottom: 0 }}>
                                        {clockOutError}
                                    </p>
                                )}
                            </div>

                            <div style={{ display: 'flex', gap: 10 }}>
                                <button
                                    type="button"
                                    onClick={() => {
                                        setConfirmClockOut(null);
                                        setClockOutPassword('');
                                        setClockOutError('');
                                        setShowClockOutPw(false);
                                    }}
                                    disabled={clockOutLoading}
                                    style={{
                                        flex: 1, padding: '11px', borderRadius: 10, border: '1px solid rgba(100,116,139,0.3)',
                                        background: 'transparent', color: '#94a3b8', fontFamily: 'Sora, sans-serif',
                                        fontWeight: 600, cursor: 'pointer', fontSize: '0.85rem',
                                        opacity: clockOutLoading ? 0.5 : 1
                                    }}
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={!clockOutPassword || clockOutLoading}
                                    style={{
                                        flex: 1, padding: '11px', borderRadius: 10, border: 'none',
                                        background: 'linear-gradient(135deg, #ef4444, #dc2626)',
                                        color: 'white', fontFamily: 'Sora, sans-serif',
                                        fontWeight: 600,
                                        cursor: (!clockOutPassword || clockOutLoading) ? 'not-allowed' : 'pointer',
                                        fontSize: '0.85rem',
                                        opacity: (!clockOutPassword || clockOutLoading) ? 0.5 : 1
                                    }}
                                >
                                    {clockOutLoading ? 'Verifying…' : 'Clock Out'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            {/* Main layout */}
            <div style={{ position: 'relative', zIndex: 1, maxWidth: 1100, margin: '0 auto', padding: '32px 24px' }}>

                {/* Header */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 40, flexWrap: 'wrap', gap: 16 }}>
                    <div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 4 }}>
                            <h1 style={{ fontFamily: 'Georgia, serif', fontSize: '1.8rem', fontWeight: 700, color: '#f0f9ff' }}>WorkFlow</h1>
                            <span style={{ color: '#334155', fontSize: '1rem' }}>·</span>
                            <span style={{ color: '#38bdf8', fontSize: '0.85rem', fontWeight: 600, letterSpacing: '1px', textTransform: 'uppercase' }}>Kiosk</span>
                        </div>
                        <div className="live-date">{dateStr}</div>
                        {kioskIP && (
                            <div style={{ fontFamily: 'DM Mono, monospace', fontSize: '0.7rem', color: '#334155', letterSpacing: '1px', marginTop: 4 }}>
                                LOCATION IP · {kioskIP}
                            </div>
                        )}
                    </div>
                    <div style={{ textAlign: 'right' }}>
                        <div className="live-clock">{nowStr}</div>
                        {clockedInEmployees.length > 0 && (
                            <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 6 }}>
                                <span className="badge-active">{clockedInEmployees.length} ON SHIFT</span>
                            </div>
                        )}
                    </div>
                </div>

                {/* Two-column layout */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 380px', gap: 32, alignItems: 'start' }}>

                    {/* LEFT — Active employees */}
                    <div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
                            <div className="pulse-dot" />
                            <h2 style={{ fontSize: '0.8rem', fontWeight: 600, letterSpacing: '2px', textTransform: 'uppercase', color: '#475569' }}>
                                Currently On Shift — This Location
                            </h2>
                        </div>

                        {kioskIPError ? (
                            <div className="empty-state">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7f1d1d" strokeWidth="1.5" style={{ marginBottom: 16 }}>
                                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                                </svg>
                                <p style={{ fontSize: '0.9rem', color: '#f87171' }}>{kioskIPError}</p>
                            </div>
                        ) : !kioskIP ? (
                            <div className="empty-state">
                                <p style={{ fontSize: '0.85rem', color: '#475569' }}>Detecting location…</p>
                            </div>
                        ) : clockedInEmployees.length === 0 ? (
                            <div className="empty-state">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1e293b" strokeWidth="1.5" style={{ marginBottom: 16 }}>
                                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                                </svg>
                                <p style={{ fontSize: '0.9rem', color: '#334155' }}>No one is clocked in at this location right now</p>
                            </div>
                        ) : (
                            <div style={{ display: 'grid', gap: 12 }}>
                                {clockedInEmployees.map(emp => (
                                    <div key={emp.id} className="emp-tile">
                                        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                                            <div className="avatar">{initials(emp.name)}</div>
                                            <div style={{ flex: 1, minWidth: 0 }}>
                                                <div style={{ fontWeight: 600, fontSize: '1rem', color: '#f1f5f9', marginBottom: 2 }}>
                                                    {emp.name}
                                                </div>
                                                <div style={{ fontSize: '0.78rem', color: '#475569', fontFamily: 'DM Mono, monospace' }}>
                                                    IN @ {formatTime12(emp.clockInTime)}
                                                </div>
                                            </div>
                                            <div style={{ textAlign: 'right', marginRight: 16 }}>
                                                <div className="elapsed">{formatElapsed(emp.clockInTime)}</div>
                                                <div style={{ fontSize: '0.7rem', color: '#334155', marginTop: 1, fontFamily: 'DM Mono, monospace' }}>elapsed</div>
                                            </div>
                                            <button
                                                className="btn-clock-out"
                                                onClick={() => setConfirmClockOut(emp)}
                                            >
                                                Clock Out
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* RIGHT — Login panel */}
                    <div style={{ position: 'sticky', top: 32 }}>
                        <div className="login-panel">
                            <div style={{ marginBottom: 20, textAlign: 'center' }}>
                                <div style={{
                                    width: 200, height: 150, borderRadius: 16,
                                    overflow: 'hidden',
                                    margin: '0 auto 14px',
                                    background: cameraError ? 'rgba(239,68,68,0.08)' : 'rgba(15,23,42,0.6)',
                                    border: cameraError ? '2px solid rgba(239,68,68,0.4)' : '2px solid rgba(16,185,129,0.4)',
                                    boxShadow: cameraError ? 'none' : '0 0 24px rgba(16,185,129,0.15)',
                                    position: 'relative',
                                    display: 'flex', alignItems: 'center', justifyContent: 'center'
                                }}>
                                    <video
                                        ref={videoRef}
                                        autoPlay
                                        playsInline
                                        muted
                                        style={{
                                            width: '100%',
                                            height: '100%',
                                            objectFit: 'cover',
                                            transform: 'scaleX(-1)',
                                            display: cameraError ? 'none' : 'block'
                                        }}
                                    />
                                    {cameraError && (
                                        <div style={{ textAlign: 'center', padding: 8 }}>
                                            <div style={{ fontSize: 28, marginBottom: 4 }}>📷</div>
                                            <div style={{ fontSize: '0.7rem', color: '#fca5a5', fontWeight: 600, lineHeight: 1.3 }}>
                                                Camera<br/>unavailable
                                            </div>
                                        </div>
                                    )}
                                    {!cameraError && (
                                        <div style={{
                                            position: 'absolute', bottom: 6, left: '50%',
                                            transform: 'translateX(-50%)',
                                            background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(4px)',
                                            padding: '2px 8px', borderRadius: 10,
                                            display: 'flex', alignItems: 'center', gap: 4,
                                            fontSize: '0.65rem', color: '#fff', fontWeight: 600,
                                            letterSpacing: '0.5px'
                                        }}>
                                            <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#ef4444', display: 'inline-block' }}></span>
                                            LIVE
                                        </div>
                                    )}
                                </div>
                                <h2 style={{ fontSize: '1.1rem', fontWeight: 700, color: '#f1f5f9', marginBottom: 4 }}>Clock In</h2>
                                <p style={{ fontSize: '0.8rem', color: '#475569' }}>Enter your credentials to start your shift</p>
                            </div>

                            <form onSubmit={handleLogin} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                                <div>
                                    <label style={{ display: 'block', fontSize: '0.75rem', color: '#64748b', marginBottom: 6, fontWeight: 600, letterSpacing: '0.5px', textTransform: 'uppercase' }}>
                                        Username
                                    </label>
                                    <input
                                        className="inp"
                                        type="text"
                                        placeholder="your.username"
                                        value={loginForm.username}
                                        onChange={e => setLoginForm({ ...loginForm, username: e.target.value })}
                                        required
                                        autoComplete="off"
                                        autoCapitalize="none"
                                    />
                                </div>

                                <div>
                                    <label style={{ display: 'block', fontSize: '0.75rem', color: '#64748b', marginBottom: 6, fontWeight: 600, letterSpacing: '0.5px', textTransform: 'uppercase' }}>
                                        Password
                                    </label>
                                    <div className="pw-wrap">
                                        <input
                                            className="inp"
                                            type={showPw ? 'text' : 'password'}
                                            placeholder="••••••••"
                                            value={loginForm.password}
                                            onChange={e => setLoginForm({ ...loginForm, password: e.target.value })}
                                            required
                                            style={{ paddingRight: 40 }}
                                        />
                                        <button type="button" className="pw-toggle" onClick={() => setShowPw(p => !p)}>
                                            <EyeIcon open={showPw} />
                                        </button>
                                    </div>
                                </div>

                                {loginError && (
                                    <div style={{
                                        background: 'rgba(239,68,68,0.08)',
                                        border: '1px solid rgba(239,68,68,0.25)',
                                        borderRadius: 8, padding: '10px 14px',
                                        color: '#f87171', fontSize: '0.8rem'
                                    }}>
                                        {loginError}
                                    </div>
                                )}

                                <button className="btn-primary" type="submit" disabled={loginLoading || !isOnline} style={{ marginTop: 4, opacity: (!isOnline ? 0.5 : 1) }}>
                                    {!isOnline ? 'Offline — unavailable' : (loginLoading ? 'Clocking in…' : 'Clock In →')}
                                </button>
                            </form>

                            {/* Divider */}
                            <div style={{ borderTop: '1px solid rgba(100,116,139,0.15)', margin: '24px 0 16px' }} />

                            {/* Mini legend */}
                            <div style={{ display: 'flex', justifyContent: 'center', gap: 20, fontSize: '0.72rem', color: '#334155' }}>
                                <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#4ade80', display: 'inline-block' }} />
                                    Clocked in
                                </span>
                                <span style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#334155', display: 'inline-block' }} />
                                    Off shift
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
